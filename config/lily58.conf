# Shared config applied to both halves (lily58_left and lily58_right).

# --- Display -----------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
# nice_duck_view's Kconfig.defconfig already selects the custom status screen,
# but we keep it explicit here for clarity.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Keep the screen on (don't blank on idle) so you can see your design.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- Caps Lock / HID LED indicators -----------------------------------------
# Lets the central receive Caps/Num/Scroll Lock state from the host.
CONFIG_ZMK_HID_INDICATORS=y

# --- Split: read the peripheral (right) half's battery on the central --------
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- "Light" indicator -------------------------------------------------------
# The light widget compiles to a no-op unless one of these is enabled. Only
# turn these on if your board/shield actually wires the LEDs, otherwise the
# build will fail for a missing led-strip / pwm device.
#
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_BACKLIGHT=y
