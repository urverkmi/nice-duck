# GitHub Actions build matrix consumed by the ZMK build action.
# Left (central) gets our custom screen; right (peripheral) keeps the stock
# nice!view widget for now. `nice_view_adapter` remaps the OLED header pins to
# the SPI bus the nice!view expects.
# On ZMK main (hardware-model-v2) the nice!nano v2 board target is
# `nice_nano//zmk` (short for `nice_nano@2.0.0//zmk`): all ZMK boards must be used
# with the `zmk` variant, and 2.0.0 is the default revision. The bare `nice_nano`
# resolves but skips the zmk variant, so the nice_view_adapter's board overlay
# (which defines `nice_view_spi`) never applies -> "undefined node label
# 'nice_view_spi'". Use `nice_nano@1.0.0//zmk` only if you have a v1.
include:
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_duck_view
  - board: nice_nano//zmk
    shield: lily58_right nice_view_adapter nice_view
