name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # Must track 'main': the custom widget code uses LVGL 9 / current ZMK APIs,
    # and config/west.yml pins zmk to main. The @v0.3 workflow ships an older
    # toolchain that can't parse main's hardware-model-v2 board format
    # (symptom: "Invalid BOARD; nice_nano_v2").
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
